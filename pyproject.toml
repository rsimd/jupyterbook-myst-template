[project]
name = "jupyterbook-myst-template"
version = "0.1.0"
description = "Reusable Jupyter Book 2 / MyST template with PRML-style navigation and local preview helpers"
readme = "README.md"
requires-python = ">=3.12.2"

[dependency-groups]
dev = [
    "jupyter-book>=2.1.4",
    "jupytext>=1.19.3",
]

[tool.jupytext]
formats = "notebooks//ipynb,notebooks-src//md:myst"
